<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks — Minimal To-Do List</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        // Custom neutral palette for soothing light and dark modes
                        canvas: {
                            light: '#FAFAFA',
                            dark: '#111113',
                        },
                        surface: {
                            light: '#FFFFFF',
                            dark: '#18181B',
                        },
                        subtle: {
                            light: '#F4F4F5',
                            dark: '#27272A',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.04)',
                        'soft-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth custom strikethrough animation */
        .task-text {
            position: relative;
            display: inline-block;
            transition: color 0.25s ease;
        }
        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 52%;
            width: 100%;
            height: 1.5px;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0.65;
        }
        .task-completed .task-text::after {
            transform: scaleX(1);
        }

        /* Subtle task entrance animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-task-enter {
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Subtle pop animation for daily points counter */
        @keyframes scorePop {
            0% { transform: scale(1); }
            45% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-score-pop {
            animation: scorePop 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Hide native number input spinners for clean aesthetic */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(161, 161, 170, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(161, 161, 170, 0.5);
        }
    </style>
    <!-- Early theme & window.name hydration before first paint -->
    <script>
        (function () {
            try {
                let theme = null;
                try { theme = localStorage.getItem('minimal_todo_theme_v1'); } catch (e) {}
                if (!theme && window.name && window.name.indexOf('__MIND_TODO__') === 0) {
                    const parsed = JSON.parse(window.name.slice('__MIND_TODO__'.length));
                    if (parsed && parsed.theme) theme = parsed.theme;
                }
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (theme === 'dark' || (!theme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-canvas-light dark:bg-canvas-dark text-zinc-800 dark:text-zinc-100 min-h-screen flex flex-col items-center justify-start py-10 px-4 sm:py-16 transition-colors duration-300 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-700">

    <!-- Main App Container -->
    <main class="w-full max-w-lg mx-auto">
        
        <!-- Header Section -->
        <header class="flex items-center justify-between gap-3 mb-7 px-1">
            <div>
                <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">
                    Tasks
                </h1>
                <p id="current-date" class="text-xs sm:text-sm text-zinc-400 dark:text-zinc-500 mt-1 font-normal">
                    <!-- Date populated via JS -->
                </p>
            </div>

            <!-- Right Controls: Daily Points Pill + Theme Toggle -->
            <div class="flex items-center gap-2 sm:gap-2.5">
                <!-- Daily Total Point Counter -->
                <div 
                    id="daily-points-pill"
                    title="Points earned today (resets automatically at midnight)"
                    class="flex items-center gap-1.5 pl-3 pr-2 py-1.5 rounded-xl bg-surface-light dark:bg-surface-dark border border-zinc-200/80 dark:border-zinc-800 shadow-soft dark:shadow-soft-dark transition-all duration-200"
                >
                    <!-- Minimal Spark/Star Icon -->
                    <svg class="w-3.5 h-3.5 text-amber-500 dark:text-amber-400 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L14.8 8.8L22 9.6L16.5 14.3L18.2 21.4L12 17.6L5.8 21.4L7.5 14.3L2 9.6L9.2 8.8L12 2Z" />
                    </svg>
                    <span class="text-xs text-zinc-400 dark:text-zinc-500 font-normal hidden xs:inline">Today:</span>
                    <span id="daily-points-value" class="text-xs sm:text-sm font-semibold tabular-nums text-zinc-900 dark:text-zinc-100">
                        0 pts
                    </span>

                    <!-- Subtle Manual Reset Button -->
                    <button 
                        type="button" 
                        id="reset-points-btn"
                        title="Reset today's points to 0"
                        aria-label="Reset today's points"
                        class="ml-0.5 p-1 rounded-lg text-zinc-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-subtle-light dark:hover:bg-subtle-dark transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-zinc-400/30"
                    >
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                </div>

                <!-- Theme Toggle Button -->
                <button 
                    id="theme-toggle" 
                    type="button" 
                    aria-label="Toggle Dark Mode"
                    class="p-2.5 rounded-xl bg-surface-light dark:bg-surface-dark border border-zinc-200/80 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:border-zinc-300 dark:hover:border-zinc-700 shadow-soft dark:shadow-soft-dark transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-400/30"
                >
                    <!-- Sun Icon (shown in dark mode) -->
                    <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon Icon (shown in light mode) -->
                    <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Task Input Card with Custom Point Input -->
        <form id="task-form" class="mb-6">
            <div class="flex items-center bg-surface-light dark:bg-surface-dark rounded-2xl border border-zinc-200/90 dark:border-zinc-800 shadow-soft dark:shadow-soft-dark focus-within:border-zinc-400 dark:focus-within:border-zinc-600 transition-all duration-200 pr-2">
                <!-- Task Title Input -->
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                    class="flex-1 min-w-0 bg-transparent py-3.5 pl-4 pr-2 text-sm sm:text-base text-zinc-800 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none rounded-l-2xl"
                >

                <!-- Daily Task Toggle Button -->
                <button 
                    type="button" 
                    id="daily-toggle-btn"
                    aria-pressed="false"
                    title="Repeat daily (resets every day)"
                    class="shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-medium border border-transparent text-zinc-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 hover:bg-subtle-light dark:hover:bg-subtle-dark transition-all duration-150 mr-1.5 focus:outline-none focus:ring-2 focus:ring-zinc-400/30"
                >
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="hidden sm:inline">Daily</span>
                </button>

                <!-- Divider -->
                <div class="h-5 w-px bg-zinc-200 dark:bg-zinc-800 shrink-0 mx-1"></div>

                <!-- Compact Points Input -->
                <label for="points-input" class="flex items-center gap-1 px-2 py-1 rounded-xl bg-subtle-light/70 dark:bg-subtle-dark/70 border border-transparent focus-within:border-zinc-300 dark:focus-within:border-zinc-600 transition-colors shrink-0 mr-2 cursor-text" title="Assign points for completing this task">
                    <input 
                        type="number" 
                        id="points-input" 
                        value="10"
                        placeholder="10"
                        min="0" 
                        max="9999" 
                        step="1"
                        aria-label="Task points"
                        class="w-10 text-right bg-transparent text-xs sm:text-sm font-medium tabular-nums text-zinc-700 dark:text-zinc-200 placeholder-zinc-400 focus:outline-none"
                    >
                    <span class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500 select-none">pts</span>
                </label>

                <!-- Add Button -->
                <button 
                    type="submit" 
                    id="add-btn"
                    class="shrink-0 px-3.5 py-1.5 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs sm:text-sm font-medium hover:bg-zinc-700 dark:hover:bg-zinc-300 active:scale-95 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-zinc-400/50"
                >
                    Add
                </button>
            </div>
        </form>

        <!-- Main Task List Surface -->
        <section class="bg-surface-light dark:bg-surface-dark rounded-2xl border border-zinc-200/80 dark:border-zinc-800 shadow-soft dark:shadow-soft-dark overflow-hidden transition-colors duration-300">
            
            <!-- Task Items Container -->
            <ul id="task-list" class="divide-y divide-zinc-100 dark:divide-zinc-800/80 max-h-[55vh] overflow-y-auto">
                <!-- Tasks rendered dynamically here -->
            </ul>

            <!-- Empty State Message -->
            <div id="empty-state" class="hidden py-14 px-6 text-center">
                <div class="w-11 h-11 rounded-full bg-subtle-light dark:bg-subtle-dark flex items-center justify-center mx-auto mb-3 text-zinc-400 dark:text-zinc-500">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <p id="empty-title" class="text-sm font-medium text-zinc-600 dark:text-zinc-300">No tasks yet</p>
                <p id="empty-subtitle" class="text-xs text-zinc-400 dark:text-zinc-500 mt-1">Add a task above to get started.</p>
            </div>

            <!-- Footer Controls: Counter, Filters & Clear Completed -->
            <footer id="list-footer" class="px-4 py-3 bg-zinc-50/70 dark:bg-zinc-900/40 border-t border-zinc-100 dark:border-zinc-800/80 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-zinc-500 dark:text-zinc-400">
                
                <!-- Active Task Counter & Subtle Save Status -->
                <div class="flex items-center gap-2 order-2 sm:order-1">
                    <span id="items-left" class="font-medium text-zinc-500 dark:text-zinc-400">
                        0 items left
                    </span>
                    <span id="save-indicator" title="All changes automatically synced and saved" class="inline-flex items-center gap-1 text-[11px] text-zinc-400 dark:text-zinc-500 transition-opacity duration-300">
                        <span id="save-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500/80"></span>
                        <span id="save-text">Saved</span>
                    </span>
                </div>

                <!-- Two-Tab Filter Bar (All & Completed only) -->
                <div class="flex items-center bg-subtle-light dark:bg-subtle-dark p-1 rounded-xl order-1 sm:order-2 w-full sm:w-auto justify-center" role="tablist">
                    <button type="button" data-filter="all" class="filter-btn flex-1 sm:flex-initial px-4 py-1 rounded-lg font-medium transition-all duration-150 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-xs">
                        All
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn flex-1 sm:flex-initial px-4 py-1 rounded-lg font-medium transition-all duration-150 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200">
                        Completed
                    </button>
                </div>

                <!-- Clear Completed Button -->
                <button 
                    type="button" 
                    id="clear-completed-btn" 
                    class="order-3 text-zinc-400 dark:text-zinc-500 hover:text-rose-500 dark:hover:text-rose-400 transition-colors duration-150 disabled:opacity-0 disabled:pointer-events-none"
                >
                    Clear completed
                </button>
            </footer>
        </section>

    </main>

    <!-- Non-intrusive Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-medium shadow-lg opacity-0 pointer-events-none transition-all duration-300 translate-y-2 z-50">
        Notification
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /**
         * Minimal To-Do List Application with Customizable Points, Daily Tasks,
         * and Cloud + Local Persistence (Firebase Firestore + localStorage + IndexedDB + window.name + Cookie).
         */
        const startApp = () => {
            // --- State & Storage Keys ---
            const STORAGE_KEY_STATE = 'minimal_todo_state_v2';
            const LEGACY_KEY_TASKS = 'minimal_todo_tasks_v1';
            const LEGACY_KEY_THEME = 'minimal_todo_theme_v1';
            const LEGACY_KEY_DAILY_POINTS = 'minimal_todo_daily_points_v1';
            const LEGACY_KEY_LAST_DATE = 'minimal_todo_last_active_date_v1';
            const WINDOW_NAME_PREFIX = '__MIND_TODO__';
            const COOKIE_NAME = 'minimal_todo_backup';
            const IDB_NAME = 'MinimalTodoDB';
            const IDB_STORE = 'app_state';

            let tasks = [];
            let currentFilter = 'all'; // 'all' | 'completed'
            let isNewTaskDaily = false;
            let currentTheme = 'light';
            let lastActiveDate = getLocalTodayString();
            let lastUpdatedAt = 0;
            let dailyScore = {
                date: getLocalTodayString(),
                points: 0
            };

            // --- Firebase Cloud State ---
            let db = null;
            let auth = null;
            let currentUser = null;
            let cloudReady = false;
            let unsubscribeTasks = null;
            let unsubscribeMeta = null;
            let hasLoadedInitialCloudTasks = false;
            let hasLoadedInitialCloudMeta = false;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            // --- DOM Elements ---
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('theme-toggle');
            const currentDateEl = document.getElementById('current-date');
            const dailyPointsPill = document.getElementById('daily-points-pill');
            const dailyPointsValueEl = document.getElementById('daily-points-value');
            const resetPointsBtn = document.getElementById('reset-points-btn');
            const taskForm = document.getElementById('task-form');
            const taskInput = document.getElementById('task-input');
            const dailyToggleBtn = document.getElementById('daily-toggle-btn');
            const pointsInput = document.getElementById('points-input');
            const taskListEl = document.getElementById('task-list');
            const emptyStateEl = document.getElementById('empty-state');
            const emptyTitleEl = document.getElementById('empty-title');
            const emptySubtitleEl = document.getElementById('empty-subtitle');
            const itemsLeftEl = document.getElementById('items-left');
            const saveIndicatorEl = document.getElementById('save-indicator');
            const saveDotEl = document.getElementById('save-dot');
            const saveTextEl = document.getElementById('save-text');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const toastEl = document.getElementById('toast');

            // --- Date Helper (Local YYYY-MM-DD) ---
            function getLocalTodayString() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // --- Sanitize Helpers ---
            function sanitizePoints(val) {
                const parsed = parseInt(val, 10);
                if (isNaN(parsed) || parsed < 0) return 0;
                if (parsed > 9999) return 9999;
                return parsed;
            }

            function normalizeTaskList(rawList) {
                if (!Array.isArray(rawList)) return [];
                return rawList
                    .filter(t => t && typeof t.text === 'string' && t.text.trim().length > 0)
                    .map(t => ({
                        id: String(t.id || (Date.now().toString(36) + Math.random().toString(36).substring(2, 6))),
                        text: String(t.text).trim(),
                        points: typeof t.points === 'number' ? sanitizePoints(t.points) : 10,
                        isDaily: Boolean(t.isDaily),
                        completed: Boolean(t.completed),
                        createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now(),
                        updatedAt: typeof t.updatedAt === 'number' ? t.updatedAt : (typeof t.createdAt === 'number' ? t.createdAt : Date.now())
                    }));
            }

            // --- Firebase Cloud Persistence ---
            function updateSyncStatusUI(state) {
                if (!saveIndicatorEl || !saveDotEl || !saveTextEl) return;
                if (state === 'syncing') {
                    saveDotEl.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse';
                    saveTextEl.textContent = 'Syncing...';
                } else if (state === 'synced') {
                    saveDotEl.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
                    saveTextEl.textContent = 'Synced';
                } else {
                    saveDotEl.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500/80';
                    saveTextEl.textContent = 'Saved';
                }
            }

            function getUserTasksCollection() {
                return collection(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks');
            }

            function getUserTaskDoc(taskId) {
                return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks', String(taskId));
            }

            function getUserMetaDoc() {
                return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'meta');
            }

            async function syncTaskToCloud(task) {
                if (!db || !currentUser || !task) return;
                updateSyncStatusUI('syncing');
                try {
                    await setDoc(getUserTaskDoc(task.id), {
                        id: String(task.id),
                        text: String(task.text),
                        points: sanitizePoints(task.points),
                        isDaily: Boolean(task.isDaily),
                        completed: Boolean(task.completed),
                        createdAt: Number(task.createdAt) || Date.now(),
                        updatedAt: Number(task.updatedAt) || Date.now()
                    }, { merge: true });
                    updateSyncStatusUI('synced');
                } catch (err) {
                    console.warn('Cloud task sync failed:', err);
                    updateSyncStatusUI('saved');
                }
            }

            async function deleteTaskFromCloud(taskId) {
                if (!db || !currentUser || !taskId) return;
                updateSyncStatusUI('syncing');
                try {
                    await deleteDoc(getUserTaskDoc(taskId));
                    updateSyncStatusUI('synced');
                } catch (err) {
                    console.warn('Cloud task delete failed:', err);
                    updateSyncStatusUI('saved');
                }
            }

            async function syncMetaToCloud() {
                if (!db || !currentUser) return;
                updateSyncStatusUI('syncing');
                try {
                    await setDoc(getUserMetaDoc(), {
                        dailyScore: {
                            date: dailyScore.date,
                            points: Math.max(0, Math.floor(dailyScore.points))
                        },
                        lastActiveDate: lastActiveDate,
                        theme: currentTheme,
                        updatedAt: lastUpdatedAt || Date.now()
                    }, { merge: true });
                    updateSyncStatusUI('synced');
                } catch (err) {
                    console.warn('Cloud meta sync failed:', err);
                    updateSyncStatusUI('saved');
                }
            }

            async function pushAllLocalTasksToCloud() {
                if (!db || !currentUser) return;
                const promises = tasks.map(t => syncTaskToCloud(t));
                promises.push(syncMetaToCloud());
                await Promise.all(promises);
            }

            function attachCloudListeners() {
                if (!db || !currentUser) return;
                if (unsubscribeTasks) unsubscribeTasks();
                if (unsubscribeMeta) unsubscribeMeta();

                updateSyncStatusUI('syncing');

                // Listen to user's private tasks collection
                unsubscribeTasks = onSnapshot(
                    getUserTasksCollection(),
                    (snapshot) => {
                        const cloudTasks = [];
                        snapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            if (data && typeof data.text === 'string' && data.text.trim().length > 0) {
                                cloudTasks.push({
                                    id: String(data.id || docSnap.id),
                                    text: String(data.text).trim(),
                                    points: typeof data.points === 'number' ? sanitizePoints(data.points) : 10,
                                    isDaily: Boolean(data.isDaily),
                                    completed: Boolean(data.completed),
                                    createdAt: typeof data.createdAt === 'number' ? data.createdAt : Date.now(),
                                    updatedAt: typeof data.updatedAt === 'number' ? data.updatedAt : Date.now()
                                });
                            }
                        });

                        // Sort newest first in memory (no orderBy query used)
                        cloudTasks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                        if (!hasLoadedInitialCloudTasks) {
                            hasLoadedInitialCloudTasks = true;
                            if (cloudTasks.length === 0 && tasks.length > 0) {
                                // First-time migration: push local tasks up to cloud
                                pushAllLocalTasksToCloud();
                            } else if (cloudTasks.length > 0) {
                                // Merge cloud tasks with any newer unsynced local tasks
                                const cloudMap = new Map(cloudTasks.map(t => [t.id, t]));
                                const merged = [...cloudTasks];
                                const toPushUp = [];

                                tasks.forEach(localTask => {
                                    const remote = cloudMap.get(localTask.id);
                                    if (!remote) {
                                        merged.push(localTask);
                                        toPushUp.push(localTask);
                                    } else if ((localTask.updatedAt || 0) > (remote.updatedAt || 0)) {
                                        const idx = merged.findIndex(m => m.id === localTask.id);
                                        if (idx !== -1) merged[idx] = localTask;
                                        toPushUp.push(localTask);
                                    }
                                });

                                merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                                tasks = merged;
                                persistLocalLayers(false);
                                handleDateRollover(false);
                                render();

                                if (toPushUp.length > 0) {
                                    toPushUp.forEach(t => syncTaskToCloud(t));
                                }
                            }
                        } else {
                            // Subsequent real-time updates from Firestore
                            tasks = cloudTasks;
                            persistLocalLayers(false);
                            handleDateRollover(false);
                            render();
                        }

                        cloudReady = true;
                        updateSyncStatusUI('synced');
                    },
                    (error) => {
                        console.warn('Firestore tasks listener error:', error);
                        updateSyncStatusUI('saved');
                    }
                );

                // Listen to user's settings/meta document (points, theme, lastActiveDate)
                unsubscribeMeta = onSnapshot(
                    getUserMetaDoc(),
                    (docSnap) => {
                        if (!docSnap.exists()) {
                            if (!hasLoadedInitialCloudMeta) {
                                hasLoadedInitialCloudMeta = true;
                                syncMetaToCloud();
                            }
                            return;
                        }

                        const data = docSnap.data();
                        const today = getLocalTodayString();
                        const remoteUpdatedAt = typeof data.updatedAt === 'number' ? data.updatedAt : 0;

                        if (!hasLoadedInitialCloudMeta && lastUpdatedAt > remoteUpdatedAt) {
                            hasLoadedInitialCloudMeta = true;
                            syncMetaToCloud();
                            return;
                        }
                        hasLoadedInitialCloudMeta = true;

                        if (data.dailyScore && typeof data.dailyScore.points === 'number') {
                            if (data.dailyScore.date === today) {
                                dailyScore = {
                                    date: today,
                                    points: Math.max(0, Math.floor(data.dailyScore.points))
                                };
                            } else {
                                dailyScore = { date: today, points: 0 };
                            }
                            updateDailyPointsUI(false);
                        }

                        if (typeof data.lastActiveDate === 'string') {
                            lastActiveDate = data.lastActiveDate;
                        }

                        if (data.theme === 'dark' || data.theme === 'light') {
                            applyTheme(data.theme, false);
                        }

                        handleDateRollover(true);
                        persistLocalLayers(false);
                        updateSyncStatusUI('synced');
                    },
                    (error) => {
                        console.warn('Firestore meta listener error:', error);
                    }
                );
            }

            async function initFirebasePersistence() {
                try {
                    if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                        return;
                    }
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    // Authenticate FIRST before attaching any Firestore queries
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    if (auth.currentUser) {
                        currentUser = auth.currentUser;
                        attachCloudListeners();
                    }

                    onAuthStateChanged(auth, (user) => {
                        if (user && (!currentUser || currentUser.uid !== user.uid)) {
                            currentUser = user;
                            attachCloudListeners();
                        }
                    });
                } catch (err) {
                    console.warn('Firebase initialization skipped or failed; continuing with local persistence:', err);
                }
            }

            // --- Multi-Layer Local Persistence Engine ---
            function buildSnapshot() {
                return {
                    version: 2,
                    updatedAt: lastUpdatedAt || Date.now(),
                    tasks: tasks,
                    dailyScore: dailyScore,
                    lastActiveDate: lastActiveDate,
                    theme: currentTheme
                };
            }

            function writeToLocalStorage(snapshot) {
                try {
                    const serialized = JSON.stringify(snapshot);
                    localStorage.setItem(STORAGE_KEY_STATE, serialized);
                    localStorage.setItem(LEGACY_KEY_TASKS, JSON.stringify(snapshot.tasks));
                    localStorage.setItem(LEGACY_KEY_DAILY_POINTS, JSON.stringify(snapshot.dailyScore));
                    localStorage.setItem(LEGACY_KEY_LAST_DATE, snapshot.lastActiveDate);
                    localStorage.setItem(LEGACY_KEY_THEME, snapshot.theme);
                } catch (e) {
                    console.warn('localStorage write failed:', e);
                }
            }

            function readFromLocalStorage() {
                try {
                    const rawV2 = localStorage.getItem(STORAGE_KEY_STATE);
                    if (rawV2) {
                        const parsed = JSON.parse(rawV2);
                        if (parsed && Array.isArray(parsed.tasks)) {
                            return parsed;
                        }
                    }
                    const rawTasks = localStorage.getItem(LEGACY_KEY_TASKS);
                    const rawPoints = localStorage.getItem(LEGACY_KEY_DAILY_POINTS);
                    const rawDate = localStorage.getItem(LEGACY_KEY_LAST_DATE);
                    const rawTheme = localStorage.getItem(LEGACY_KEY_THEME);

                    if (rawTasks || rawPoints || rawTheme) {
                        return {
                            version: 2,
                            updatedAt: 1,
                            tasks: rawTasks ? JSON.parse(rawTasks) : [],
                            dailyScore: rawPoints ? JSON.parse(rawPoints) : { date: getLocalTodayString(), points: 0 },
                            lastActiveDate: rawDate || getLocalTodayString(),
                            theme: rawTheme || null
                        };
                    }
                } catch (e) {
                    console.warn('localStorage read failed:', e);
                }
                return null;
            }

            function writeToWindowName(snapshot) {
                try {
                    window.name = WINDOW_NAME_PREFIX + JSON.stringify(snapshot);
                } catch (e) {
                    console.warn('window.name write failed:', e);
                }
            }

            function readFromWindowName() {
                try {
                    if (typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)) {
                        const parsed = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
                        if (parsed && Array.isArray(parsed.tasks)) {
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn('window.name read failed:', e);
                }
                return null;
            }

            function writeToCookie(snapshot) {
                try {
                    const compact = {
                        u: snapshot.updatedAt,
                        d: snapshot.lastActiveDate,
                        s: snapshot.dailyScore,
                        m: snapshot.theme,
                        t: snapshot.tasks.map(t => [t.id, t.text, t.points, t.isDaily ? 1 : 0, t.completed ? 1 : 0, t.createdAt])
                    };
                    const encoded = encodeURIComponent(JSON.stringify(compact));
                    if (encoded.length <= 3800) {
                        const maxAge = 60 * 60 * 24 * 365;
                        document.cookie = `${COOKIE_NAME}=${encoded}; path=/; max-age=${maxAge}; SameSite=Lax`;
                    }
                } catch (e) {
                    console.warn('Cookie write failed:', e);
                }
            }

            function readFromCookie() {
                try {
                    const match = document.cookie.split('; ').find(row => row.startsWith(COOKIE_NAME + '='));
                    if (!match) return null;
                    const compact = JSON.parse(decodeURIComponent(match.split('=')[1]));
                    if (!compact || !Array.isArray(compact.t)) return null;
                    return {
                        version: 2,
                        updatedAt: compact.u || 0,
                        lastActiveDate: compact.d || getLocalTodayString(),
                        dailyScore: compact.s || { date: getLocalTodayString(), points: 0 },
                        theme: compact.m || null,
                        tasks: compact.t.map(arr => ({
                            id: arr[0],
                            text: arr[1],
                            points: arr[2],
                            isDaily: Boolean(arr[3]),
                            completed: Boolean(arr[4]),
                            createdAt: arr[5] || Date.now()
                        }))
                    };
                } catch (e) {
                    console.warn('Cookie read failed:', e);
                }
                return null;
            }

            function openIndexedDB() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) {
                        reject(new Error('IndexedDB unavailable'));
                        return;
                    }
                    const request = indexedDB.open(IDB_NAME, 1);
                    request.onupgradeneeded = (event) => {
                        const dbInst = event.target.result;
                        if (!dbInst.objectStoreNames.contains(IDB_STORE)) {
                            dbInst.createObjectStore(IDB_STORE);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async function writeToIndexedDB(snapshot) {
                try {
                    const dbInst = await openIndexedDB();
                    await new Promise((resolve, reject) => {
                        const tx = dbInst.transaction(IDB_STORE, 'readwrite');
                        const store = tx.objectStore(IDB_STORE);
                        store.put(snapshot, 'primary');
                        tx.oncomplete = () => {
                            dbInst.close();
                            resolve();
                        };
                        tx.onerror = () => {
                            dbInst.close();
                            reject(tx.error);
                        };
                    });
                } catch (e) {
                    // Ignore if blocked
                }
            }

            async function readFromIndexedDB() {
                try {
                    const dbInst = await openIndexedDB();
                    return await new Promise((resolve, reject) => {
                        const tx = dbInst.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE);
                        const req = store.get('primary');
                        req.onsuccess = () => {
                            dbInst.close();
                            resolve(req.result || null);
                        };
                        req.onerror = () => {
                            dbInst.close();
                            reject(req.error);
                        };
                    });
                } catch (e) {
                    return null;
                }
            }

            let savePulseTimeout;
            function pulseSaveIndicator() {
                if (!saveIndicatorEl) return;
                clearTimeout(savePulseTimeout);
                saveIndicatorEl.classList.add('text-emerald-600', 'dark:text-emerald-400');
                saveIndicatorEl.classList.remove('text-zinc-400', 'dark:text-zinc-500');
                savePulseTimeout = setTimeout(() => {
                    saveIndicatorEl.classList.remove('text-emerald-600', 'dark:text-emerald-400');
                    saveIndicatorEl.classList.add('text-zinc-400', 'dark:text-zinc-500');
                }, 900);
            }

            function persistLocalLayers(bumpTimestamp = true) {
                if (bumpTimestamp) {
                    lastUpdatedAt = Date.now();
                }
                const snapshot = buildSnapshot();
                writeToLocalStorage(snapshot);
                writeToWindowName(snapshot);
                writeToCookie(snapshot);
                writeToIndexedDB(snapshot);
                pulseSaveIndicator();
            }

            function persistAllState(bumpTimestamp = true) {
                persistLocalLayers(bumpTimestamp);
                syncMetaToCloud();
            }

            function applySnapshot(snapshot) {
                if (!snapshot) return false;
                const today = getLocalTodayString();
                tasks = normalizeTaskList(snapshot.tasks);

                if (snapshot.dailyScore && typeof snapshot.dailyScore.points === 'number') {
                    if (snapshot.dailyScore.date === today) {
                        dailyScore = {
                            date: today,
                            points: Math.max(0, Math.floor(snapshot.dailyScore.points))
                        };
                    } else {
                        dailyScore = { date: today, points: 0 };
                    }
                } else {
                    dailyScore = { date: today, points: 0 };
                }

                lastActiveDate = snapshot.lastActiveDate || today;
                lastUpdatedAt = typeof snapshot.updatedAt === 'number' ? snapshot.updatedAt : Date.now();

                if (snapshot.theme === 'dark' || snapshot.theme === 'light') {
                    applyTheme(snapshot.theme, false);
                }
                return true;
            }

            function pickNewestSnapshot(candidates) {
                const valid = candidates.filter(c => c && Array.isArray(c.tasks));
                if (valid.length === 0) return null;
                valid.sort((a, b) => {
                    const timeA = typeof a.updatedAt === 'number' ? a.updatedAt : 0;
                    const timeB = typeof b.updatedAt === 'number' ? b.updatedAt : 0;
                    if (timeB !== timeA) return timeB - timeA;
                    return b.tasks.length - a.tasks.length;
                });
                return valid[0];
            }

            // --- Initialization ---
            async function init() {
                initThemeFallback();
                renderDate();

                // Synchronously restore from fast local layers immediately
                const syncCandidates = [
                    readFromLocalStorage(),
                    readFromWindowName(),
                    readFromCookie()
                ];
                const bestSync = pickNewestSnapshot(syncCandidates);
                if (bestSync) {
                    applySnapshot(bestSync);
                }

                handleDateRollover(false);
                updateDailyPointsUI(false);
                render();

                // Check IndexedDB backup
                const idbSnapshot = await readFromIndexedDB();
                if (idbSnapshot && Array.isArray(idbSnapshot.tasks)) {
                    const idbTime = typeof idbSnapshot.updatedAt === 'number' ? idbSnapshot.updatedAt : 0;
                    const currentTime = bestSync && typeof bestSync.updatedAt === 'number' ? bestSync.updatedAt : 0;
                    if (!cloudReady && (!bestSync || idbTime > currentTime || (tasks.length === 0 && idbSnapshot.tasks.length > 0))) {
                        applySnapshot(idbSnapshot);
                        handleDateRollover(false);
                        updateDailyPointsUI(false);
                        render();
                    }
                }

                persistLocalLayers(false);

                // Initialize Firebase Firestore Cloud Sync
                await initFirebasePersistence();

                // Flush state on app exit / hide / unload so zero changes are lost
                const flushOnExit = () => persistLocalLayers(false);
                window.addEventListener('pagehide', flushOnExit);
                window.addEventListener('beforeunload', flushOnExit);

                // Re-verify daily reset & flush on visibility/focus changes
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        persistLocalLayers(false);
                    } else {
                        handleDateRollover(true);
                    }
                });
                window.addEventListener('focus', () => handleDateRollover(true));
                setInterval(() => handleDateRollover(true), 60000);
            }

            // --- Unified Daily Date Rollover (Points + Recurring Daily Tasks) ---
            function handleDateRollover(shouldRender = true) {
                const today = getLocalTodayString();
                const pointsReset = ensureDailyReset();
                const isNewDay = (lastActiveDate && lastActiveDate !== today) || pointsReset;

                if (isNewDay) {
                    const modifiedDailyTasks = [];
                    tasks.forEach(task => {
                        if (task.isDaily && task.completed) {
                            task.completed = false;
                            task.updatedAt = Date.now();
                            modifiedDailyTasks.push(task);
                        }
                    });
                    lastActiveDate = today;
                    persistAllState(true);
                    modifiedDailyTasks.forEach(t => syncTaskToCloud(t));
                    renderDate();
                    if (shouldRender) {
                        render();
                        showToast('New day! Daily tasks & points reset');
                    }
                } else if (lastActiveDate !== today) {
                    lastActiveDate = today;
                    persistAllState(false);
                }
            }

            // --- Daily Input Toggle UI ---
            function setNewTaskDaily(active) {
                isNewTaskDaily = active;
                dailyToggleBtn.setAttribute('aria-pressed', String(active));
                if (active) {
                    dailyToggleBtn.className = 'shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-medium border border-sky-200 dark:border-sky-800/80 bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 transition-all duration-150 mr-1.5 focus:outline-none focus:ring-2 focus:ring-sky-400/30';
                    taskInput.placeholder = 'Add a daily recurring task...';
                } else {
                    dailyToggleBtn.className = 'shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-medium border border-transparent text-zinc-400 dark:text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 hover:bg-subtle-light dark:hover:bg-subtle-dark transition-all duration-150 mr-1.5 focus:outline-none focus:ring-2 focus:ring-zinc-400/30';
                    taskInput.placeholder = 'Add a new task...';
                }
            }

            dailyToggleBtn.addEventListener('click', () => {
                setNewTaskDaily(!isNewTaskDaily);
                taskInput.focus();
            });

            // --- Theme Management ---
            function applyTheme(theme, persist = true) {
                currentTheme = theme === 'dark' ? 'dark' : 'light';
                if (currentTheme === 'dark') {
                    htmlEl.classList.add('dark');
                    htmlEl.classList.remove('light');
                } else {
                    htmlEl.classList.add('light');
                    htmlEl.classList.remove('dark');
                }
                if (persist) {
                    persistAllState(true);
                }
            }

            function initThemeFallback() {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const initial = htmlEl.classList.contains('dark') || prefersDark ? 'dark' : 'light';
                applyTheme(initial, false);
            }

            themeToggleBtn.addEventListener('click', () => {
                const nextTheme = htmlEl.classList.contains('dark') ? 'light' : 'dark';
                applyTheme(nextTheme, true);
            });

            // --- Date Display ---
            function renderDate() {
                const options = { weekday: 'long', month: 'short', day: 'numeric' };
                currentDateEl.textContent = new Date().toLocaleDateString(undefined, options);
            }

            // --- Daily Points Helpers ---
            function ensureDailyReset() {
                const today = getLocalTodayString();
                if (dailyScore.date !== today) {
                    dailyScore = { date: today, points: 0 };
                    updateDailyPointsUI(false);
                    return true;
                }
                return false;
            }

            function adjustDailyPoints(delta, animate = true) {
                ensureDailyReset();
                dailyScore.points = Math.max(0, dailyScore.points + delta);
                persistAllState(true);
                updateDailyPointsUI(animate && delta !== 0);
            }

            function updateDailyPointsUI(animate = false) {
                dailyPointsValueEl.textContent = `${dailyScore.points} ${dailyScore.points === 1 ? 'pt' : 'pts'}`;
                if (animate) {
                    dailyPointsPill.classList.remove('animate-score-pop');
                    void dailyPointsPill.offsetWidth;
                    dailyPointsPill.classList.add('animate-score-pop');
                }
            }

            resetPointsBtn.addEventListener('click', () => {
                ensureDailyReset();
                if (dailyScore.points === 0) {
                    showToast("Today's points are already 0");
                    return;
                }
                dailyScore.points = 0;
                persistAllState(true);
                updateDailyPointsUI(true);
                showToast("Reset today's points to 0");
            });

            // --- Toast Feedback ---
            let toastTimeout;
            function showToast(message) {
                clearTimeout(toastTimeout);
                toastEl.textContent = message;
                toastEl.classList.remove('opacity-0', 'translate-y-2');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                    toastEl.classList.add('opacity-0', 'translate-y-2');
                }, 2000);
            }

            // --- CRUD Operations ---
            function addTask(text, rawPoints) {
                handleDateRollover(false);
                const trimmed = text.trim();
                if (!trimmed) {
                    showToast('Please enter a task');
                    taskInput.focus();
                    return;
                }

                const points = rawPoints === '' ? 10 : sanitizePoints(rawPoints);
                const now = Date.now();

                const newTask = {
                    id: now.toString(36) + Math.random().toString(36).substring(2, 6),
                    text: trimmed,
                    points: points,
                    isDaily: isNewTaskDaily,
                    completed: false,
                    createdAt: now,
                    updatedAt: now
                };

                tasks.unshift(newTask);
                persistLocalLayers(true);
                syncTaskToCloud(newTask);
                render(newTask.id);
                taskInput.value = '';
                pointsInput.value = '10';
                setNewTaskDaily(false);
                taskInput.focus();
            }

            function toggleTaskDaily(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                task.isDaily = !task.isDaily;
                task.updatedAt = Date.now();
                persistLocalLayers(true);
                syncTaskToCloud(task);
                render();
                showToast(task.isDaily ? 'Set as Daily task (resets each day)' : 'Changed to one-time task');
            }

            function toggleTask(id) {
                handleDateRollover(false);
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                task.completed = !task.completed;
                task.updatedAt = Date.now();

                const taskPoints = typeof task.points === 'number' ? task.points : 0;
                if (task.completed) {
                    adjustDailyPoints(taskPoints, true);
                } else {
                    adjustDailyPoints(-taskPoints, true);
                }

                syncTaskToCloud(task);

                const itemEl = document.querySelector(`[data-task-id="${id}"]`);
                if (itemEl) {
                    const checkboxBtn = itemEl.querySelector('.toggle-btn');
                    const textWrapper = itemEl.querySelector('.text-wrapper');
                    const pointsBadge = itemEl.querySelector('.points-badge');
                    
                    if (task.completed) {
                        textWrapper.classList.add('task-completed', 'text-zinc-400', 'dark:text-zinc-500');
                        textWrapper.classList.remove('text-zinc-800', 'dark:text-zinc-100');
                        checkboxBtn.classList.add('bg-zinc-900', 'dark:bg-zinc-100', 'border-zinc-900', 'dark:border-zinc-100', 'text-white', 'dark:text-zinc-900');
                        checkboxBtn.classList.remove('border-zinc-300', 'dark:border-zinc-600');
                        checkboxBtn.querySelector('svg').classList.remove('opacity-0', 'scale-50');
                        checkboxBtn.querySelector('svg').classList.add('opacity-100', 'scale-100');
                        if (pointsBadge) {
                            pointsBadge.classList.add('opacity-60');
                        }
                    } else {
                        textWrapper.classList.remove('task-completed', 'text-zinc-400', 'dark:text-zinc-500');
                        textWrapper.classList.add('text-zinc-800', 'dark:text-zinc-100');
                        checkboxBtn.classList.remove('bg-zinc-900', 'dark:bg-zinc-100', 'border-zinc-900', 'dark:border-zinc-100', 'text-white', 'dark:text-zinc-900');
                        checkboxBtn.classList.add('border-zinc-300', 'dark:border-zinc-600');
                        checkboxBtn.querySelector('svg').classList.add('opacity-0', 'scale-50');
                        checkboxBtn.querySelector('svg').classList.remove('opacity-100', 'scale-100');
                        if (pointsBadge) {
                            pointsBadge.classList.remove('opacity-60');
                        }
                    }
                }

                updateFooterStats();
                if (currentFilter !== 'all') {
                    setTimeout(() => render(), 320);
                }
            }

            // --- Inline Point Editing on Existing Tasks ---
            function startInlinePointEdit(taskId, badgeBtn) {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                if (badgeBtn.parentElement.querySelector('.inline-point-editor')) return;

                const editorWrapper = document.createElement('div');
                editorWrapper.className = 'inline-point-editor shrink-0 flex items-center gap-0.5 px-2 py-0.5 rounded-full bg-white dark:bg-zinc-800 border border-zinc-400 dark:border-zinc-500 shadow-xs';

                const input = document.createElement('input');
                input.type = 'number';
                input.min = '0';
                input.max = '9999';
                input.step = '1';
                input.value = task.points;
                input.setAttribute('aria-label', 'Edit task points');
                input.className = 'w-10 text-right bg-transparent text-xs font-medium tabular-nums text-zinc-900 dark:text-zinc-100 focus:outline-none';

                const unit = document.createElement('span');
                unit.className = 'text-[10px] text-zinc-400 dark:text-zinc-500 select-none';
                unit.textContent = 'pts';

                editorWrapper.appendChild(input);
                editorWrapper.appendChild(unit);

                badgeBtn.replaceWith(editorWrapper);
                input.focus();
                input.select();

                let committed = false;
                function commitEdit() {
                    if (committed) return;
                    committed = true;

                    const oldPoints = typeof task.points === 'number' ? task.points : 0;
                    const newPoints = input.value === '' ? oldPoints : sanitizePoints(input.value);

                    if (newPoints !== oldPoints) {
                        task.points = newPoints;
                        task.updatedAt = Date.now();

                        if (task.completed) {
                            adjustDailyPoints(newPoints - oldPoints, true);
                        } else {
                            persistLocalLayers(true);
                        }
                        syncTaskToCloud(task);
                    }
                    render();
                }

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        commitEdit();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        committed = true;
                        render();
                    }
                });

                input.addEventListener('blur', commitEdit);
            }

            function deleteTask(id) {
                const itemEl = document.querySelector(`[data-task-id="${id}"]`);
                if (itemEl) {
                    itemEl.style.opacity = '0';
                    itemEl.style.transform = 'translateX(8px)';
                    itemEl.style.transition = 'all 0.2s ease';
                }

                tasks = tasks.filter(t => t.id !== id);
                persistLocalLayers(true);
                deleteTaskFromCloud(id);

                setTimeout(() => {
                    render();
                }, 180);
            }

            function clearCompleted() {
                const completedOneOffTasks = tasks.filter(t => t.completed && !t.isDaily);
                const completedDailyTasks = tasks.filter(t => t.completed && t.isDaily);
                const completedOneOffCount = completedOneOffTasks.length;
                const completedDailyCount = completedDailyTasks.length;

                if (completedOneOffCount === 0 && completedDailyCount === 0) return;

                const now = Date.now();
                const updatedDailyTasks = [];

                tasks = tasks
                    .filter(t => !(t.completed && !t.isDaily))
                    .map(t => {
                        if (t.completed && t.isDaily) {
                            const resetTask = { ...t, completed: false, updatedAt: now };
                            updatedDailyTasks.push(resetTask);
                            return resetTask;
                        }
                        return t;
                    });

                persistLocalLayers(true);
                completedOneOffTasks.forEach(t => deleteTaskFromCloud(t.id));
                updatedDailyTasks.forEach(t => syncTaskToCloud(t));
                render();

                if (completedOneOffCount > 0 && completedDailyCount > 0) {
                    showToast(`Cleared ${completedOneOffCount} one-off & reset ${completedDailyCount} daily`);
                } else if (completedOneOffCount > 0) {
                    showToast(`Cleared ${completedOneOffCount} completed ${completedOneOffCount === 1 ? 'task' : 'tasks'}`);
                } else {
                    showToast(`Reset ${completedDailyCount} completed daily ${completedDailyCount === 1 ? 'task' : 'tasks'}`);
                }
            }

            // --- Filtering & Rendering ---
            function getFilteredTasks() {
                if (currentFilter === 'completed') {
                    return tasks.filter(t => t.completed);
                }
                return tasks;
            }

            function updateFooterStats() {
                const activeCount = tasks.filter(t => !t.completed).length;
                const completedCount = tasks.length - activeCount;

                itemsLeftEl.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'} left`;
                clearCompletedBtn.disabled = completedCount === 0;
            }

            function updateFilterUI() {
                filterBtns.forEach(btn => {
                    const isSelected = btn.dataset.filter === currentFilter;
                    if (isSelected) {
                        btn.className = 'filter-btn flex-1 sm:flex-initial px-4 py-1 rounded-lg font-medium transition-all duration-150 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-xs';
                    } else {
                        btn.className = 'filter-btn flex-1 sm:flex-initial px-4 py-1 rounded-lg font-medium transition-all duration-150 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200';
                    }
                });
            }

            function render(newlyAddedId = null) {
                const filteredTasks = getFilteredTasks();
                updateFooterStats();
                updateFilterUI();

                // Toggle empty state vs task list
                if (filteredTasks.length === 0) {
                    taskListEl.innerHTML = '';
                    taskListEl.classList.add('hidden');
                    emptyStateEl.classList.remove('hidden');

                    if (tasks.length === 0) {
                        emptyTitleEl.textContent = 'All clear';
                        emptySubtitleEl.textContent = 'Add a task above to plan your day.';
                    } else {
                        emptyTitleEl.textContent = 'No completed tasks';
                        emptySubtitleEl.textContent = 'Tasks you check off will appear here.';
                    }
                    return;
                }

                emptyStateEl.classList.add('hidden');
                taskListEl.classList.remove('hidden');

                taskListEl.innerHTML = filteredTasks.map(task => {
                    const isNew = task.id === newlyAddedId ? 'animate-task-enter' : '';
                    const completedClasses = task.completed 
                        ? 'task-completed text-zinc-400 dark:text-zinc-500' 
                        : 'text-zinc-800 dark:text-zinc-100';
                    const checkboxClasses = task.completed
                        ? 'bg-zinc-900 dark:bg-zinc-100 border-zinc-900 dark:border-zinc-100 text-white dark:text-zinc-900'
                        : 'border-zinc-300 dark:border-zinc-600 hover:border-zinc-500 dark:hover:border-zinc-400';
                    const checkIconClasses = task.completed
                        ? 'opacity-100 scale-100'
                        : 'opacity-0 scale-50';
                    const badgeOpacity = task.completed ? 'opacity-60' : '';
                    const pts = typeof task.points === 'number' ? task.points : 10;
                    const dailyBadgeHTML = task.isDaily
                        ? `<span class="inline-flex items-center gap-1 ml-2 px-1.5 py-0.5 rounded-md text-[10px] font-medium align-middle bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-400 border border-sky-200/70 dark:border-sky-800/70 select-none">
                               <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                                   <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                               </svg>
                               Daily
                           </span>`
                        : '';
                    const repeatToggleClasses = task.isDaily
                        ? 'text-sky-600 dark:text-sky-400 bg-sky-50/80 dark:bg-sky-950/50 opacity-100'
                        : 'text-zinc-400 dark:text-zinc-500 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-subtle-light dark:hover:bg-subtle-dark';

                    return `
                        <li data-task-id="${task.id}" class="group flex items-center justify-between gap-2 px-4 py-3.5 hover:bg-zinc-50/80 dark:hover:bg-zinc-800/40 transition-colors duration-150 ${isNew}">
                            <div class="flex items-center gap-3.5 flex-1 min-w-0 cursor-pointer select-none" data-action="toggle">
                                <!-- Custom Checkbox -->
                                <button 
                                    type="button" 
                                    aria-label="${task.completed ? 'Mark as active' : 'Mark as completed'}"
                                    class="toggle-btn shrink-0 w-5 h-5 rounded-full border-[1.75px] flex items-center justify-center transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-400/40 ${checkboxClasses}"
                                >
                                    <svg class="w-3 h-3 transition-all duration-200 ${checkIconClasses}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                </button>

                                <!-- Task Label with Strikethrough & Optional Daily Badge -->
                                <span class="text-wrapper text-sm sm:text-[15px] leading-relaxed break-words min-w-0 ${completedClasses}">
                                    <span class="task-text">${escapeHTML(task.text)}</span>${dailyBadgeHTML}
                                </span>
                            </div>

                            <!-- Editable Task Points Pill Badge -->
                            <button 
                                type="button"
                                data-action="edit-points"
                                title="Click to edit points"
                                aria-label="Edit points (${pts} pts)"
                                class="points-badge shrink-0 px-2.5 py-0.5 rounded-full text-[11px] font-medium tabular-nums bg-subtle-light dark:bg-subtle-dark text-zinc-600 dark:text-zinc-300 border border-zinc-200/70 dark:border-zinc-700/70 hover:border-zinc-400 dark:hover:border-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-zinc-400/30 ${badgeOpacity}"
                            >
                                +${pts} pts
                            </button>

                            <!-- Toggle Daily Recurrence Button -->
                            <button 
                                type="button" 
                                data-action="toggle-daily"
                                title="${task.isDaily ? 'Daily task (click to make one-time)' : 'Make daily recurring task'}"
                                aria-label="${task.isDaily ? 'Disable daily repeat' : 'Enable daily repeat'}"
                                class="shrink-0 p-1.5 rounded-lg transition-all duration-150 focus:outline-none ${repeatToggleClasses}"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>

                            <!-- Delete Button -->
                            <button 
                                type="button" 
                                data-action="delete"
                                aria-label="Delete task"
                                class="shrink-0 p-1.5 rounded-lg text-zinc-400 dark:text-zinc-500 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 hover:text-rose-500 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition-all duration-150 focus:outline-none"
                            >
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </li>
                    `;
                }).join('');
            }

            // Prevent XSS when rendering user text
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // --- Event Listeners ---
            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                addTask(taskInput.value, pointsInput.value);
            });

            // Event delegation for task toggle, inline point editing, daily toggle, and delete
            taskListEl.addEventListener('click', (e) => {
                const li = e.target.closest('li[data-task-id]');
                if (!li) return;

                const taskId = li.dataset.taskId;
                const deleteBtn = e.target.closest('[data-action="delete"]');
                const toggleDailyBtn = e.target.closest('[data-action="toggle-daily"]');
                const editPointsBtn = e.target.closest('[data-action="edit-points"]');
                const toggleArea = e.target.closest('[data-action="toggle"]');

                if (deleteBtn) {
                    deleteTask(taskId);
                } else if (toggleDailyBtn) {
                    toggleTaskDaily(taskId);
                } else if (editPointsBtn) {
                    startInlinePointEdit(taskId, editPointsBtn);
                } else if (toggleArea) {
                    toggleTask(taskId);
                }
            });

            // Filter tab switching
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    render();
                });
            });

            // Clear completed tasks
            clearCompletedBtn.addEventListener('click', clearCompleted);

            // Start the app
            init();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
